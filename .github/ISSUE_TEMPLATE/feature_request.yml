name: Feature request
description: Suggest a change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is the problem
      description: The situation you are in, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
    validations:
      required: true
